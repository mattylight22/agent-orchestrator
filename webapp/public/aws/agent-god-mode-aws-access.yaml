AWSTemplateFormatVersion: "2010-09-09"
Description: Credentialless Agent God Mode access roles for one AWS account connection.

Parameters:
  BrokerRoleArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$'
  ConnectionId:
    Type: String
    AllowedPattern: '^[a-f0-9]{12}$'
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 32

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub AgentGodModeInstance-${ConnectionId}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - { Key: AgentGodModeConnection, Value: !Ref ConnectionId }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub AgentGodModeInstance-${ConnectionId}
      Roles: [!Ref InstanceRole]

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub AgentGodModeExecution-${ConnectionId}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AgentGodModePaseoInfrastructure
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadNetworkAndImages
                Effect: Allow
                Action:
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVolumes
                  - ec2:DescribeVpcs
                  - ssm:GetParameters
                Resource: '*'
              - Sid: ManagePaseoCompute
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:CreateSecurityGroup
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DeleteSecurityGroup
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                Resource: '*'
              - Sid: ReadOnlyPaseoInstanceProfile
                Effect: Allow
                Action: iam:GetInstanceProfile
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/AgentGodModeInstance-${ConnectionId}
              - Sid: PassOnlyPaseoInstanceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt InstanceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
      Tags:
        - { Key: AgentGodModeConnection, Value: !Ref ConnectionId }

  CustomerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub AgentGodModeCustomer-${ConnectionId}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref BrokerRoleArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: AgentGodModeCustomerControl
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DiscoverNetwork
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - cloudformation:ListStacks
                  - ssm:DescribeInstanceInformation
                  - ssm:ListCommandInvocations
                  - ssm:GetCommandInvocation
                Resource: '*'
              - Sid: CreatePaseoStackWithDesignatedRole
                Effect: Allow
                Action: cloudformation:CreateStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/agent-god-mode-paseo-*/*
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt ExecutionRole.Arn
              - Sid: ManageOnlyPaseoStacks
                Effect: Allow
                Action:
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                Resource: !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/agent-god-mode-paseo-*/*
              - Sid: PassOnlyDesignatedExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: UseAwsRunShellScript
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:*::document/AWS-RunShellScript
              - Sid: RunCommandsOnlyOnConnectionInstances
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/AgentGodModeConnection: !Ref ConnectionId
      Tags:
        - { Key: AgentGodModeConnection, Value: !Ref ConnectionId }

Outputs:
  CustomerRoleArn:
    Description: Paste this value into Agent God Mode to verify the account.
    Value: !GetAtt CustomerRole.Arn
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  InstanceProfileName:
    Value: !Ref InstanceProfile
